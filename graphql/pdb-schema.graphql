"""Query root"""
type Query {
  """Get entry given the id."""
  entry(entry_id: String!): CoreEntry

  """Get a list of entries given a list of IDs."""
  entries(entry_ids: [String!]!): [CoreEntry]

  """Get an assembly given the ENTRY ID and ASSEMBLY ID."""
  assembly(entry_id: String!, assembly_id: String!): CoreAssembly

  """Get a list of assemblies given the list of ASSEMBLY IDs."""
  assemblies(assembly_ids: [String!]!): [CoreAssembly]

  """Get a polymer entity, given the ENTRY ID and ENTITY ID."""
  polymer_entity(entry_id: String!, entity_id: String!): CorePolymerEntity

  """Get a list of polymer entities given a list of ENTITY IDs."""
  polymer_entities(entity_ids: [String!]!): [CorePolymerEntity]

  """Get a non-polymer entity, given the ENTRY ID and ENTITY ID."""
  nonpolymer_entity(entry_id: String!, entity_id: String!): CoreNonpolymerEntity

  """Get a list of non-polymer entities given a list of ENTITY IDs."""
  nonpolymer_entities(entity_ids: [String!]!): [CoreNonpolymerEntity]

  """Get a branched entity, given the ENTRY ID and ENTITY ID."""
  branched_entity(entry_id: String!, entity_id: String!): CoreBranchedEntity

  """Get a list of branched entities given a list of ENTITY IDs."""
  branched_entities(entity_ids: [String!]!): [CoreBranchedEntity]

  """Get a polymer entity instance (chain), given the ENTRY ID and ASYM ID."""
  polymer_entity_instance(entry_id: String!, asym_id: String!): CorePolymerEntityInstance

  """Get a list of polymer entity instances (chains), given the list of INSTANCE IDs."""
  polymer_entity_instances(instance_ids: [String!]!): [CorePolymerEntityInstance]

  """Get a non-polymer entity instance (chain), given the ENTRY ID and ASYM ID."""
  nonpolymer_entity_instance(entry_id: String!, asym_id: String!): CoreNonpolymerEntityInstance

  """Get a list of non-polymer entity instances (chains), given the list of INSTANCE IDs."""
  nonpolymer_entity_instances(instance_ids: [String!]!): [CoreNonpolymerEntityInstance]

  """Get a branched entity instance (chain), given the ENTRY ID and ASYM ID."""
  branched_entity_instance(entry_id: String!, asym_id: String!): CoreBranchedEntityInstance

  """Get a list of branched entity instances (chains), given the list of INSTANCE IDs."""
  branched_entity_instances(instance_ids: [String!]!): [CoreBranchedEntityInstance]

  """Get a pairwise polymeric interface given the ENTRY ID, ASSEMBLY ID, and INTERFACE ID."""
  interface(entry_id: String!, assembly_id: String!, interface_id: String!): CoreInterface

  """Get a list of pairwise polymeric interfaces given a list of INTERFACE IDs."""
  interfaces(interface_ids: [String!]!): [CoreInterface]

  """Get a chemical component given the CHEMICAL COMPONENT ID."""
  chem_comp(comp_id: String!): CoreChemComp

  """Get a list of chemical components given the list of CHEMICAL COMPONENT IDs."""
  chem_comps(comp_ids: [String!]!): [CoreChemComp]

  """Get literature information from PubMed database given the PubMed ID."""
  pubmed(pubmed_id: Int!): CorePubmed

  """Get UniProt KB entry given the UniProt primary accession."""
  uniprot(uniprot_id: String!): CoreUniprot

  """Given a group ID get a group object formed by aggregating entries."""
  entry_group(group_id: String!): GroupEntry

  """Given a list of group IDs get a list of group objects formed by aggregating entries."""
  entry_groups(group_ids: [String!]!): [GroupEntry]

  """Given a group ID get a group object formed by aggregating polymer entities."""
  polymer_entity_group(group_id: String!): GroupPolymerEntity

  """Given a list of group IDs get a list of group objects formed by aggregating polymer entities."""
  polymer_entity_groups(group_ids: [String!]!): [GroupPolymerEntity]

  """Given a group ID get a group object formed by aggregating non-polymer entities."""
  nonpolymer_entity_group(group_id: String!): GroupNonPolymerEntity

  """Given a list of group IDs get a list of group objects formed by aggregating non-polymer entities."""
  nonpolymer_entity_groups(group_ids: [String!]!): [GroupNonPolymerEntity]

  """Given a group provenance ID get an object that describes aggregation methodology."""
  group_provenance(group_provenance_id: String!): GroupProvenance
}

