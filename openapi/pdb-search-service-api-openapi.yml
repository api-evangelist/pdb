          content:
            application/json:
              schema:
                type: object
        '408':
          description: "Request Timeout.\n The server did not receive complete results within the time that it was prepared to wait"
          content:
            application/json:
              schema:
                type: object
        '500':
          description: "Internal Server Error.\n The server encountered unexpected error"
