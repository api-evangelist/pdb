- aid: pdb:rcsb-pdb-sequence-coordinates-api
  name: RCSB PDB Sequence Coordinates API
  description: >-
    GraphQL service providing sequence-level alignments between structural databases and external sequence
    resources. Exposes two core queries — alignment and annotations — enabling callers to map PDB chain
    positions to UniProt, NCBI RefSeq (protein and genomic), CATH, SCOPe, and Computed Structure Models
    (CSMs). Replaces the legacy 1D Coordinates Service.
  humanURL: https://sequence-coordinates.rcsb.org
  baseURL: https://sequence-coordinates.rcsb.org/graphql
  tags:
  - Sequence Alignment
  - UniProt
  - NCBI
  - GraphQL
  - Annotations
  properties:
  - type: Documentation
    url: https://sequence-coordinates.rcsb.org
  - type: GraphQLExplorer
    url: https://sequence-coordinates.rcsb.org/graphiql/index.html
  contact:
  - type: Email
    url: mailto:info@rcsb.org
- aid: pdb:rcsb-pdb-alignment-api
  name: RCSB PDB Structure Alignment API
  description: >-
    Asynchronous REST API that performs programmatic structure alignment calculations between PDB entries
    or user-supplied coordinate files. Callers submit an alignment job via POST /submit (accepting PDBx/mmCIF,
    BinaryCIF, or legacy PDB format, with optional gzip compression), receive a UUID ticket, and poll
    GET /results for status and output. Enables large-scale structural comparison workflows without manual
    interaction with the RCSB PDB website.
  humanURL: https://alignment.rcsb.org
  baseURL: https://alignment.rcsb.org
  tags:
  - Structure Alignment
  - Structural Comparison
  - Asynchronous
  - Computational
  properties:
  - type: Documentation
    url: https://alignment.rcsb.org/api-reference.html
  - type: QueryEditor
    url: https://alignment.rcsb.org/query-editor.html
